name: Release update package and container

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: phd-atlas-public-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zhoujasper/phd-atlas

jobs:
  release:
    if: github.repository == 'zhoujasper/phd-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the tagged public source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Verify release tag and freeze build time
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -e "const value = JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version; if (typeof value !== 'string' || !value) process.exit(1); process.stdout.write(value)")"
          if ! node -e 'const pattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/; if (!pattern.test(process.argv[1])) process.exit(1)' "$package_version"; then
            echo "::error title=Invalid package version::package.json version '$package_version' is not a supported SemVer value."
            exit 1
          fi
          if [[ "$package_version" == *+* ]]; then
            echo "::error title=Unsupported container version::Public release versions cannot contain SemVer build metadata because OCI tags cannot represent '+' without collisions."
            exit 1
          fi
          expected_tag="v${package_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error title=Release tag/version mismatch::Expected tag '$expected_tag' from package.json, received '$GITHUB_REF_NAME'."
            exit 1
          fi
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          if ! [[ "$source_date_epoch" =~ ^[0-9]+$ ]]; then
            echo "::error title=Missing source timestamp::Could not derive SOURCE_DATE_EPOCH from the tagged commit."
            exit 1
          fi
          release_notes_path="$RUNNER_TEMP/phd-atlas-${package_version}-release-notes.md"
          node tools/extract-release-notes.mjs \
            --version "$package_version" \
            --output "$release_notes_path"
          {
            echo "PACKAGE_VERSION=$package_version"
            echo "SOURCE_DATE_EPOCH=$source_date_epoch"
            echo "RELEASE_NOTES_PATH=$release_notes_path"
          } >> "$GITHUB_ENV"

      - name: Remove withdrawn Beta.6 and Beta.7 container versions
        if: env.PACKAGE_VERSION == '0.1.0-beta.6'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One-time replacement cleanup. These IDs were resolved and checked
          # immediately before withdrawing the former Beta.6/Beta.7 releases.
          # A rerun is safe because an already-absent version returns 404.
          version_ids=(
            1073239413 1073239399 1073239383 1073239364 1073239350
            1073188281 1073188270 1073188259 1073188245 1073188233
            1072693398 1072693391 1072693384 1072693371 1072693361
            1071458511 1071458499 1071458485 1071458473 1071458455
            1071392602 1071392586 1071392555 1071392500 1071392466
          )
          for version_id in "${version_ids[@]}"; do
            response_path="$RUNNER_TEMP/phd-atlas-package-delete-${version_id}.json"
            http_code="$(
              curl \
                --silent \
                --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --request DELETE \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --output "$response_path" \
                --write-out '%{http_code}' \
                "${GITHUB_API_URL}/user/packages/container/phd-atlas/versions/${version_id}"
            )"
            case "$http_code" in
              204)
                echo "Deleted withdrawn GHCR package version ${version_id}."
                ;;
              404)
                echo "Withdrawn GHCR package version ${version_id} is already absent."
                ;;
              *)
                echo "::error title=Withdrawn container cleanup failed::Package version ${version_id} returned HTTP ${http_code}."
                cat "$response_path"
                exit 1
                ;;
            esac
          done

      - name: Verify Microsoft SQL Server 2022 adapter
        shell: bash
        run: |
          set -euo pipefail
          container_name="phd-atlas-mssql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sa_password="PhD!$(openssl rand -hex 24)Aa1"
          schema_name="phd_atlas_smoke_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "::add-mask::$sa_password"
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker logs --tail 200 "$container_name" 2>&1 || true
            fi
            docker rm --force --volumes "$container_name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          docker run --detach \
            --name "$container_name" \
            --env ACCEPT_EULA=Y \
            --env MSSQL_SA_PASSWORD="$sa_password" \
            --publish 127.0.0.1::1433 \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null
          published_address="$(docker port "$container_name" 1433/tcp | tail -n 1)"
          published_port="${published_address##*:}"
          if ! [[ "$published_port" =~ ^[0-9]+$ ]]; then
            echo "::error title=MSSQL smoke setup failed::Could not resolve the published SQL Server port."
            exit 1
          fi
          export PHD_ATLAS_RUN_EXTERNAL_DB_SMOKE=1
          export PHD_ATLAS_SMOKE_DB_ENGINE=mssql
          export PHD_ATLAS_SMOKE_DB_HOST=127.0.0.1
          export PHD_ATLAS_SMOKE_DB_PORT="$published_port"
          export PHD_ATLAS_SMOKE_DB_NAME=master
          export PHD_ATLAS_SMOKE_DB_USER=sa
          export PHD_ATLAS_SMOKE_DB_PASSWORD="$sa_password"
          export PHD_ATLAS_SMOKE_DB_SCHEMA="$schema_name"
          export PHD_ATLAS_SMOKE_DB_SSL=false
          export PHD_ATLAS_SMOKE_READY_TIMEOUT_MS=300000
          node tools/smoke-external-database.mjs

      - name: Verify source
        run: npm run verify:tree

      - name: Build and reproduce the update package
        shell: bash
        run: |
          set -euo pipefail
          npm run build:update-package
          package_path="storage/update-packages/phd-atlas-update-${PACKAGE_VERSION}-release.tar.gz"
          if [ ! -f "$package_path" ] || [ ! -f "${package_path}.sha256" ]; then
            echo "::error title=Missing update assets::The deterministic update package or checksum was not produced."
            exit 1
          fi
          first_package="$RUNNER_TEMP/$(basename "$package_path").first"
          first_checksum="${first_package}.sha256"
          cp "$package_path" "$first_package"
          cp "${package_path}.sha256" "$first_checksum"
          npm run build:update-package
          cmp --silent "$first_package" "$package_path"
          cmp --silent "$first_checksum" "${package_path}.sha256"
          node tools/verify-update-package.mjs "$package_path"
          npm run verify:beta8-update -- "$package_path"
          (
            cd "$(dirname "$package_path")"
            sha256sum --check "$(basename "$package_path").sha256"
          )
          echo "PACKAGE_PATH=$package_path" >> "$GITHUB_ENV"

      - name: Build a differential update from the previous compatible Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "DELTA_PATH=" >> "$GITHUB_ENV"
          echo "DELTA_BASE_VERSION=" >> "$GITHUB_ENV"
          releases_json="$RUNNER_TEMP/phd-atlas-previous-releases.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$releases_json"
          selection_json="$RUNNER_TEMP/phd-atlas-delta-base.json"
          RELEASES_JSON="$releases_json" CURRENT_VERSION="$PACKAGE_VERSION" \
            node --input-type=module > "$selection_json" <<'NODE'
          import fs from 'node:fs'
          import { compareSemanticVersions } from './server/systemUpdate.js'

          const pages = JSON.parse(fs.readFileSync(process.env.RELEASES_JSON, 'utf8'))
          const current = process.env.CURRENT_VERSION
          const stableTarget = !current.includes('-')
          const targetPrereleaseChannel = stableTarget
            ? ''
            : current.slice(current.indexOf('-') + 1).split('.')[0]
          const candidates = pages.flat().flatMap((release) => {
            if (release.draft || !String(release.tag_name || '').startsWith('v')) return []
            const version = String(release.tag_name).slice(1)
            try {
              if (compareSemanticVersions(version, current) >= 0) return []
            } catch {
              return []
            }
            if (stableTarget && release.prerelease) return []
            if (!stableTarget) {
              const candidateChannel = version.includes('-')
                ? version.slice(version.indexOf('-') + 1).split('.')[0]
                : ''
              if (!release.prerelease || candidateChannel !== targetPrereleaseChannel) return []
            }
            const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            const packagePattern = new RegExp(`^phd-atlas-update-${escaped}-.+\\.tar\\.gz$`)
            const packages = (release.assets || []).filter((asset) => packagePattern.test(asset.name))
            if (packages.length !== 1) return []
            const checksums = (release.assets || []).filter(
              (asset) => asset.name === `${packages[0].name}.sha256`,
            )
            if (checksums.length !== 1) return []
            return [{
              version,
              packageName: packages[0].name,
              packageId: packages[0].id,
              checksumName: checksums[0].name,
              checksumId: checksums[0].id,
            }]
          }).sort((left, right) => compareSemanticVersions(right.version, left.version))
          if (candidates[0]) process.stdout.write(JSON.stringify(candidates[0]))
          NODE
          if [ ! -s "$selection_json" ]; then
            echo "No compatible previous Release package is available; publishing the complete package only."
            exit 0
          fi

          base_version="$(jq -r '.version' "$selection_json")"
          base_package_name="$(jq -r '.packageName' "$selection_json")"
          base_package_id="$(jq -r '.packageId' "$selection_json")"
          base_checksum_name="$(jq -r '.checksumName' "$selection_json")"
          base_checksum_id="$(jq -r '.checksumId' "$selection_json")"
          if ! [[ "$base_package_id" =~ ^[0-9]+$ && "$base_checksum_id" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid differential base::The previous Release asset IDs are invalid."
            exit 1
          fi
          base_dir="$RUNNER_TEMP/phd-atlas-delta-base"
          mkdir -p "$base_dir"
          gh api --header 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${base_package_id}" \
            > "$base_dir/$base_package_name"
          gh api --header 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${base_checksum_id}" \
            > "$base_dir/$base_checksum_name"
          (
            cd "$base_dir"
            sha256sum --check "$base_checksum_name"
          )

          node tools/build-update-delta.mjs "$base_dir/$base_package_name" "$PACKAGE_PATH"
          delta_path="storage/update-packages/phd-atlas-delta-${base_version}-to-${PACKAGE_VERSION}-release.tar.gz"
          if [ ! -f "$delta_path" ] || [ ! -f "${delta_path}.sha256" ]; then
            echo "::error title=Missing differential assets::The delta package or checksum was not produced."
            exit 1
          fi
          first_delta="$RUNNER_TEMP/$(basename "$delta_path").first"
          first_delta_checksum="${first_delta}.sha256"
          cp "$delta_path" "$first_delta"
          cp "${delta_path}.sha256" "$first_delta_checksum"
          node tools/build-update-delta.mjs "$base_dir/$base_package_name" "$PACKAGE_PATH"
          cmp --silent "$first_delta" "$delta_path"
          cmp --silent "$first_delta_checksum" "${delta_path}.sha256"
          node tools/verify-update-delta.mjs "$base_dir/$base_package_name" "$delta_path"
          if [ "$(stat -c '%s' "$delta_path")" -ge "$(stat -c '%s' "$PACKAGE_PATH")" ]; then
            echo "The differential package is not smaller than the complete package; omitting it."
            rm -f "$delta_path" "${delta_path}.sha256"
            exit 0
          fi
          echo "DELTA_PATH=$delta_path" >> "$GITHUB_ENV"
          echo "DELTA_BASE_VERSION=$base_version" >> "$GITHUB_ENV"

      - name: Prepare an idempotent Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(basename "$PACKAGE_PATH")"
          checksum_name="${package_name}.sha256"
          version_prefix="phd-atlas-update-${PACKAGE_VERSION}-"
          delta_suffix="-to-${PACKAGE_VERSION}-release.tar.gz"
          delta_checksum_suffix="${delta_suffix}.sha256"
          delta_name=""
          delta_checksum_name=""
          asset_paths=("$PACKAGE_PATH" "${PACKAGE_PATH}.sha256")
          asset_names=("$package_name" "$checksum_name")
          if [[ -n "${DELTA_PATH:-}" ]]; then
            delta_name="$(basename "$DELTA_PATH")"
            delta_checksum_name="${delta_name}.sha256"
            asset_paths+=("$DELTA_PATH" "${DELTA_PATH}.sha256")
            asset_names+=("$delta_name" "$delta_checksum_name")
          fi
          expected_prerelease=false
          channel_args=()
          if [[ "${PACKAGE_VERSION%%+*}" == *-* ]]; then
            expected_prerelease=true
            channel_args+=(--prerelease)
          fi

          release_json="$RUNNER_TEMP/phd-atlas-release-before.json"
          release_pages="$RUNNER_TEMP/phd-atlas-release-pages.json"
          load_release_by_tag() {
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$release_pages"
            release_count="$(
              jq --arg tag "$GITHUB_REF_NAME" \
                '[.[][] | select(.tag_name == $tag)] | length' \
                "$release_pages"
            )"
            if [[ "$release_count" -gt 1 ]]; then
              echo "::error title=Duplicate Releases::More than one Release targets $GITHUB_REF_NAME."
              exit 1
            fi
            if [[ "$release_count" -eq 0 ]]; then
              return 1
            fi
            jq --arg tag "$GITHUB_REF_NAME" \
              '[.[][] | select(.tag_name == $tag)][0]' \
              "$release_pages" > "$release_json"
          }

          if ! load_release_by_tag; then
            gh release create "$GITHUB_REF_NAME" \
              "${asset_paths[@]}" \
              --draft \
              --verify-tag \
              --notes-file "$RELEASE_NOTES_PATH" \
              "${channel_args[@]}" \
              --title "PhD Atlas $GITHUB_REF_NAME"
            release_loaded=false
            for attempt in $(seq 1 30); do
              if load_release_by_tag; then
                release_loaded=true
                break
              fi
              echo "Waiting for Draft Release ID (attempt $attempt/30)."
              sleep 2
            done
            if [[ "$release_loaded" != true ]]; then
              echo "::error title=Missing Draft Release::The created Release was not discoverable through the authenticated Releases API."
              exit 1
            fi
          fi

          release_id="$(jq -r '.id' "$release_json")"
          actual_tag="$(jq -r '.tag_name' "$release_json")"
          actual_prerelease="$(jq -r '.prerelease' "$release_json")"
          is_draft="$(jq -r '.draft' "$release_json")"
          if ! [[ "$release_id" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid Release ID::The authenticated Releases API did not return a numeric ID."
            exit 1
          fi
          if [[ "$actual_tag" != "$GITHUB_REF_NAME" || "$actual_prerelease" != "$expected_prerelease" ]]; then
            echo "::error title=Release metadata mismatch::Existing Release tag or prerelease channel differs from the canonical package version."
            exit 1
          fi
          if [[ "$is_draft" == true ]]; then
            patch_json="$RUNNER_TEMP/phd-atlas-release-draft-patch.json"
            jq -n \
              --arg tag "$GITHUB_REF_NAME" \
              --arg target "$GITHUB_SHA" \
              --arg name "PhD Atlas $GITHUB_REF_NAME" \
              --rawfile body "$RELEASE_NOTES_PATH" \
              --argjson prerelease "$expected_prerelease" \
              '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: true, prerelease: $prerelease}' \
              > "$patch_json"
            gh api --method PATCH \
              --input "$patch_json" \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "$release_json"
          fi

          unexpected_assets="$(jq -r \
            --arg prefix "$version_prefix" \
            --arg delta_suffix "$delta_suffix" \
            --arg delta_checksum_suffix "$delta_checksum_suffix" \
            --arg package "$package_name" \
            --arg checksum "$checksum_name" \
            --arg delta "$delta_name" \
            --arg delta_checksum "$delta_checksum_name" \
            '.assets[].name | select(
              (
                startswith($prefix)
                or (
                  startswith("phd-atlas-delta-")
                  and (endswith($delta_suffix) or endswith($delta_checksum_suffix))
                )
              )
              and . != $package
              and . != $checksum
              and . != $delta
              and . != $delta_checksum
            )' \
            "$release_json")"
          if [[ -n "$unexpected_assets" ]]; then
            echo "::error title=Unexpected release assets::Refusing to remove or overwrite existing version assets: $unexpected_assets"
            exit 1
          fi

          for asset_index in "${!asset_names[@]}"; do
            asset_name="${asset_names[$asset_index]}"
            asset_count="$(jq -r --arg name "$asset_name" '[.assets[] | select(.name == $name)] | length' "$release_json")"
            if [[ "$asset_count" -gt 1 ]]; then
              echo "::error title=Duplicate release asset::Release contains more than one '$asset_name'."
              exit 1
            fi
            if [[ "$asset_count" -eq 0 ]]; then
              if [[ "$is_draft" != true ]]; then
                echo "::error title=Published Release is incomplete::Refusing to mutate a public Release that is missing '$asset_name'."
                exit 1
              fi
              asset_path="${asset_paths[$asset_index]}"
              if [[ "$asset_name" == *.tar.gz ]]; then
                content_type="application/gzip"
              else
                content_type="text/plain"
              fi
              gh api \
                --hostname uploads.github.com \
                --method POST \
                --header "Content-Type: ${content_type}" \
                --input "$asset_path" \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset_name}" \
                > /dev/null
            fi
          done

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "$release_json"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"

          remote_dir="$RUNNER_TEMP/phd-atlas-release-assets-before"
          mkdir -p "$remote_dir"
          download_release_asset() {
            local asset_name="$1"
            local output_path="$2"
            local asset_id
            asset_id="$(
              jq -r --arg name "$asset_name" \
                '[.assets[] | select(.name == $name)] | if length == 1 then .[0].id else empty end' \
                "$release_json"
            )"
            if ! [[ "$asset_id" =~ ^[0-9]+$ ]]; then
              echo "::error title=Missing immutable asset::Release does not contain exactly one '$asset_name'."
              exit 1
            fi
            gh api \
              --header 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$output_path"
          }
          for asset_index in "${!asset_names[@]}"; do
            asset_name="${asset_names[$asset_index]}"
            asset_path="${asset_paths[$asset_index]}"
            download_release_asset "$asset_name" "$remote_dir/$asset_name"
            if ! cmp --silent "$asset_path" "$remote_dir/$asset_name"; then
              echo "::error title=Immutable release asset mismatch::Existing '$asset_name' differs from this tagged source."
              exit 1
            fi
          done
          (
            cd "$remote_dir"
            sha256sum --check "$checksum_name"
            if [[ -n "$delta_checksum_name" ]]; then
              sha256sum --check "$delta_checksum_name"
            fi
          )

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve the already-qualified public image
        id: existing_image
        shell: bash
        run: |
          set -euo pipefail
          inspect_digest() {
            local output digest
            if ! output="$(docker buildx imagetools inspect "$1" 2>/dev/null)"; then
              return 1
            fi
            digest="$(printf '%s\n' "$output" | awk '$1 == "Digest:" { print $2; exit }')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
            printf '%s' "$digest"
          }
          version_ref="${REGISTRY}/${IMAGE_NAME}:${PACKAGE_VERSION}"
          tag_ref="${REGISTRY}/${IMAGE_NAME}:v${PACKAGE_VERSION}"
          sha_ref="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA:0:12}"
          version_digest=""
          tag_digest=""
          version_digest="$(inspect_digest "$version_ref" || true)"
          tag_digest="$(inspect_digest "$tag_ref" || true)"
          if [[ -z "$version_digest" && -z "$tag_digest" ]]; then
            sha_digest="$(inspect_digest "$sha_ref" || true)"
            if [[ -z "$sha_digest" ]]; then
              echo "::error title=Missing qualified image::The exact public commit has no immutable $sha_ref image from the successful main container gate."
              exit 1
            fi
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "digest=$sha_digest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$version_digest" || -z "$tag_digest" ]]; then
            echo "::error title=Partial immutable image publication::Exactly one canonical version tag exists. Refusing an ambiguous repair."
            exit 1
          fi
          if [[ "$version_digest" != "$tag_digest" ]]; then
            echo "::error title=Immutable image mismatch::The canonical version tags resolve to different digests."
            exit 1
          fi
          echo "reuse=true" >> "$GITHUB_OUTPUT"
          echo "digest=$version_digest" >> "$GITHUB_OUTPUT"

      - name: Select the image digest to validate
        shell: bash
        env:
          EXISTING_DIGEST: ${{ steps.existing_image.outputs.digest }}
        run: |
          set -euo pipefail
          release_digest="$EXISTING_DIGEST"
          if ! [[ "$release_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Missing image digest::No canonical multi-architecture image digest is available."
            exit 1
          fi
          echo "RELEASE_IMAGE_DIGEST=$release_digest" >> "$GITHUB_ENV"

      - name: Verify the anonymous qualified image manifest
        shell: bash
        run: |
          set -euo pipefail
          bash tools/wait-for-container-digest.sh \
            "${REGISTRY}/${IMAGE_NAME}@${RELEASE_IMAGE_DIGEST}" \
            "$RELEASE_IMAGE_DIGEST"
          manifest_path="$RUNNER_TEMP/phd-atlas-candidate-manifest.json"
          docker buildx imagetools inspect \
            --raw "${REGISTRY}/${IMAGE_NAME}@${RELEASE_IMAGE_DIGEST}" > "$manifest_path"
          MANIFEST_PATH="$manifest_path" node <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH, 'utf8'))
          const platforms = new Set(
            (manifest.manifests || []).map((entry) =>
              `${entry.platform?.os || ''}/${entry.platform?.architecture || ''}`,
            ),
          )
          for (const expected of ['linux/amd64', 'linux/arm64']) {
            if (!platforms.has(expected)) {
              throw new Error(`Candidate image is missing ${expected}. Found: ${[...platforms].join(', ')}`)
            }
          }
          NODE

      - name: Smoke test the qualified image on amd64 and arm64
        shell: bash
        run: |
          node tools/smoke-container-image.mjs \
            "${REGISTRY}/${IMAGE_NAME}@${RELEASE_IMAGE_DIGEST}" \
            candidate

      - name: Log in to promote immutable version tags
        if: steps.existing_image.outputs.reuse != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the validated digest to immutable version tags
        if: steps.existing_image.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for ref in \
            "${REGISTRY}/${IMAGE_NAME}:v${PACKAGE_VERSION}" \
            "${REGISTRY}/${IMAGE_NAME}:${PACKAGE_VERSION}"; do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "::error title=Immutable version tag appeared concurrently::Refusing to overwrite '$ref'."
              exit 1
            fi
          done
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:v${PACKAGE_VERSION}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:${PACKAGE_VERSION}" \
            "${REGISTRY}/${IMAGE_NAME}@${RELEASE_IMAGE_DIGEST}"

      - name: Remove promotion credentials
        if: steps.existing_image.outputs.reuse != 'true'
        shell: bash
        run: docker logout "$REGISTRY"

      - name: Verify anonymous immutable tags and platforms
        shell: bash
        run: |
          set -euo pipefail
          for ref in \
            "${REGISTRY}/${IMAGE_NAME}:v${PACKAGE_VERSION}" \
            "${REGISTRY}/${IMAGE_NAME}:${PACKAGE_VERSION}"; do
            bash tools/wait-for-container-digest.sh "$ref" "$RELEASE_IMAGE_DIGEST"
          done
          manifest_path="$RUNNER_TEMP/phd-atlas-official-manifest.json"
          docker buildx imagetools inspect \
            --raw "${REGISTRY}/${IMAGE_NAME}:${PACKAGE_VERSION}" > "$manifest_path"
          MANIFEST_PATH="$manifest_path" node <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH, 'utf8'))
          const platforms = new Set(
            (manifest.manifests || []).map((entry) =>
              `${entry.platform?.os || ''}/${entry.platform?.architecture || ''}`,
            ),
          )
          for (const expected of ['linux/amd64', 'linux/arm64']) {
            if (!platforms.has(expected)) {
              throw new Error(`Official image is missing ${expected}. Found: ${[...platforms].join(', ')}`)
            }
          }
          NODE

      - name: Smoke test the official version tag on amd64 and arm64
        shell: bash
        run: |
          node tools/smoke-container-image.mjs \
            "${REGISTRY}/${IMAGE_NAME}:${PACKAGE_VERSION}" \
            official

      - name: Decide whether this version may move a release channel
        id: release_channel
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import { compareSemanticVersions } from './server/systemUpdate.js'

          const current = process.env.PACKAGE_VERSION
          const prerelease = current.includes('-') ? current.slice(current.indexOf('-') + 1) : ''
          const isBeta = prerelease.split('.')[0] === 'beta'
          const isStable = !prerelease
          const tags = execFileSync('git', ['tag', '--list', 'v*'], { encoding: 'utf8' })
            .split(/\r?\n/)
            .filter(Boolean)
            .map((tag) => tag.slice(1))
          const betaVersions = tags.filter((version) => {
            const value = version.includes('-') ? version.slice(version.indexOf('-') + 1) : ''
            return value.split('.')[0] === 'beta'
          })
          const higherBeta = isBeta
            ? betaVersions.find((version) => compareSemanticVersions(version, current) > 0)
            : undefined
          const stableVersions = tags.filter((version) => !version.includes('-'))
          const higherStable = isStable
            ? stableVersions.find((version) => compareSemanticVersions(version, current) > 0)
            : undefined
          const promoteBeta = isBeta && !higherBeta
          const promoteStable = isStable && !higherStable
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `promote_beta=${promoteBeta}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `promote_stable=${promoteStable}\n`)
          if (promoteBeta) {
            console.log(`${current} is the highest tagged beta and may move :beta.`)
          } else if (higherBeta) {
            console.log(`Skipping :beta because the higher ${higherBeta} tag already exists.`)
          }
          if (promoteStable) {
            console.log(`${current} is the highest tagged stable release and may move :stable and :latest.`)
          } else if (higherStable) {
            console.log(`Skipping stable channels because the higher ${higherStable} tag already exists.`)
          }
          if (!isBeta && !isStable) console.log(`${current} does not own a moving release channel.`)
          NODE

      - name: Log in to promote release channels
        if: steps.release_channel.outputs.promote_beta == 'true' || steps.release_channel.outputs.promote_stable == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the validated digest to beta
        if: steps.release_channel.outputs.promote_beta == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:beta" \
            "${REGISTRY}/${IMAGE_NAME}@${RELEASE_IMAGE_DIGEST}"
          bash tools/wait-for-container-digest.sh \
            "${REGISTRY}/${IMAGE_NAME}:beta" \
            "$RELEASE_IMAGE_DIGEST"

      - name: Promote the validated digest to stable and latest
        if: steps.release_channel.outputs.promote_stable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:stable" \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}@${RELEASE_IMAGE_DIGEST}"
          bash tools/wait-for-container-digest.sh \
            "${REGISTRY}/${IMAGE_NAME}:stable" \
            "$RELEASE_IMAGE_DIGEST"
          bash tools/wait-for-container-digest.sh \
            "${REGISTRY}/${IMAGE_NAME}:latest" \
            "$RELEASE_IMAGE_DIGEST"

      - name: Remove release-channel promotion credentials
        if: steps.release_channel.outputs.promote_beta == 'true' || steps.release_channel.outputs.promote_stable == 'true'
        shell: bash
        run: docker logout "$REGISTRY"

      - name: Revalidate assets and publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(basename "$PACKAGE_PATH")"
          checksum_name="${package_name}.sha256"
          version_prefix="phd-atlas-update-${PACKAGE_VERSION}-"
          delta_suffix="-to-${PACKAGE_VERSION}-release.tar.gz"
          delta_checksum_suffix="${delta_suffix}.sha256"
          delta_name=""
          delta_checksum_name=""
          asset_paths=("$PACKAGE_PATH" "${PACKAGE_PATH}.sha256")
          asset_names=("$package_name" "$checksum_name")
          if [[ -n "${DELTA_PATH:-}" ]]; then
            delta_name="$(basename "$DELTA_PATH")"
            delta_checksum_name="${delta_name}.sha256"
            asset_paths+=("$DELTA_PATH" "${DELTA_PATH}.sha256")
            asset_names+=("$delta_name" "$delta_checksum_name")
          fi
          expected_prerelease=false
          if [[ "${PACKAGE_VERSION%%+*}" == *-* ]]; then
            expected_prerelease=true
          fi

          release_json="$RUNNER_TEMP/phd-atlas-release-final-draft.json"
          if ! [[ "${RELEASE_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "::error title=Missing Release ID::Draft preparation did not persist a canonical Release ID."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$release_json"
          RELEASE_JSON="$release_json" \
          EXPECTED_PACKAGE_NAME="$package_name" \
          EXPECTED_CHECKSUM_NAME="$checksum_name" \
          EXPECTED_DELTA_NAME="$delta_name" \
          EXPECTED_DELTA_CHECKSUM_NAME="$delta_checksum_name" \
          EXPECTED_PRERELEASE="$expected_prerelease" \
          VERSION_PREFIX="$version_prefix" \
          DELTA_SUFFIX="$delta_suffix" \
          DELTA_CHECKSUM_SUFFIX="$delta_checksum_suffix" \
          node <<'NODE'
          const fs = require('node:fs')
          const payload = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON, 'utf8'))
          if (
            payload.tag_name !== process.env.GITHUB_REF_NAME
            || String(payload.prerelease) !== process.env.EXPECTED_PRERELEASE
          ) {
            throw new Error('Release metadata does not match its canonical SemVer tag/channel.')
          }
          const names = (payload.assets || []).map((asset) => asset.name)
          const versionNames = names.filter((name) => (
            name.startsWith(process.env.VERSION_PREFIX)
            || (
              name.startsWith('phd-atlas-delta-')
              && (
                name.endsWith(process.env.DELTA_SUFFIX)
                || name.endsWith(process.env.DELTA_CHECKSUM_SUFFIX)
              )
            )
          ))
          const expected = [
            process.env.EXPECTED_PACKAGE_NAME,
            process.env.EXPECTED_CHECKSUM_NAME,
            process.env.EXPECTED_DELTA_NAME,
            process.env.EXPECTED_DELTA_CHECKSUM_NAME,
          ].filter(Boolean).sort()
          if (
            versionNames.length !== expected.length
            || JSON.stringify([...versionNames].sort()) !== JSON.stringify(expected)
          ) {
            throw new Error(`Release update assets do not match the immutable full/delta set. Found: ${names.join(', ')}`)
          }
          NODE

          remote_dir="$RUNNER_TEMP/phd-atlas-release-assets-final"
          mkdir -p "$remote_dir"
          download_release_asset() {
            local asset_name="$1"
            local output_path="$2"
            local asset_id
            asset_id="$(
              jq -r --arg name "$asset_name" \
                '[.assets[] | select(.name == $name)] | if length == 1 then .[0].id else empty end' \
                "$release_json"
            )"
            if ! [[ "$asset_id" =~ ^[0-9]+$ ]]; then
              echo "::error title=Missing immutable asset::Release does not contain exactly one '$asset_name'."
              exit 1
            fi
            gh api \
              --header 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$output_path"
          }
          for asset_index in "${!asset_names[@]}"; do
            asset_name="${asset_names[$asset_index]}"
            asset_path="${asset_paths[$asset_index]}"
            download_release_asset "$asset_name" "$remote_dir/$asset_name"
            cmp --silent "$asset_path" "$remote_dir/$asset_name"
          done
          (
            cd "$remote_dir"
            sha256sum --check "$checksum_name"
            if [[ -n "$delta_checksum_name" ]]; then
              sha256sum --check "$delta_checksum_name"
            fi
          )

          published_json="$RUNNER_TEMP/phd-atlas-release-published.json"
          if [[ "$(jq -r '.draft' "$release_json")" == true ]]; then
            patch_json="$RUNNER_TEMP/phd-atlas-release-publish-patch.json"
            jq -n \
              --arg tag "$GITHUB_REF_NAME" \
              --arg target "$GITHUB_SHA" \
              --arg name "PhD Atlas $GITHUB_REF_NAME" \
              --rawfile body "$RELEASE_NOTES_PATH" \
              --argjson prerelease "$expected_prerelease" \
              '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: false, prerelease: $prerelease}' \
              > "$patch_json"
            gh api --method PATCH \
              --input "$patch_json" \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$published_json"
          else
            cp "$release_json" "$published_json"
          fi

          if [[ "$(jq -r '.draft' "$published_json")" != false ]]; then
            echo "::error title=Release publication failed::The verified Release is still a draft."
            exit 1
          fi
          PUBLISHED_JSON="$published_json" RELEASE_NOTES_PATH="$RELEASE_NOTES_PATH" node <<'NODE'
          const fs = require('node:fs')
          const payload = JSON.parse(fs.readFileSync(process.env.PUBLISHED_JSON, 'utf8'))
          const expected = fs.readFileSync(process.env.RELEASE_NOTES_PATH, 'utf8').trim()
          if (String(payload.body || '').trim() !== expected) {
            throw new Error('Published Release notes differ from the versioned RELEASE_NOTES.md section.')
          }
          NODE
          echo "Published $GITHUB_REF_NAME only after its update package and public multi-architecture container passed all gates."
