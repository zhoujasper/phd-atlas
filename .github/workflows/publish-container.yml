name: Validate and publish main container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phd-atlas-container-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zhoujasper/phd-atlas

jobs:
  validate-pull-request:
    if: github.repository == 'zhoujasper/phd-atlas' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate pull request
        run: |
          npm ci
          npm run verify:tree

  build-pull-request-image:
    if: github.repository == 'zhoujasper/phd-atlas' && github.event_name == 'pull_request'
    needs: validate-pull-request
    name: build-pr-${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the native architecture without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=container-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.architecture }}

  gate-main:
    if: github.repository == 'zhoujasper/phd-atlas' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      actions: read
      contents: read
    outputs:
      candidate-tag: ${{ steps.identity.outputs.candidate_tag }}
      short-sha: ${{ steps.identity.outputs.short_sha }}
    steps:
      - name: Wait for matching CI gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow ci.yml \
                --commit "$GITHUB_SHA" \
                --event push \
                --limit 10 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
            if [[ -n "$run_id" ]]; then
              break
            fi
            echo "Waiting for CI on $GITHUB_SHA (attempt $attempt/60)."
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            echo "::error title=Missing CI gate::CI did not start for $GITHUB_SHA."
            exit 1
          fi
          gh run watch "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --interval 15 \
            --exit-status

      - name: Define candidate and immutable SHA tags
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "candidate_tag=candidate-main-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

  build-main-architecture:
    needs: gate-main
    name: build-main-${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in for architecture candidate publication
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the native architecture candidate
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.gate-main.outputs.candidate-tag }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main
          cache-from: type=gha,scope=container-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.architecture }}

      - name: Remove registry credentials before architecture validation
        shell: bash
        run: docker logout "$REGISTRY"

      - name: Verify and smoke test the anonymous architecture candidate
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.gate-main.outputs.candidate-tag }}-${{ matrix.architecture }}
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Missing architecture digest::Buildx did not return a canonical ${ARCHITECTURE} digest."
            exit 1
          fi
          bash tools/wait-for-container-digest.sh "$IMAGE_REF" "$IMAGE_DIGEST"
          node tools/smoke-container-image.mjs \
            "${IMAGE_REF}@${IMAGE_DIGEST}" \
            "main-candidate-${ARCHITECTURE}" \
            --architectures "$ARCHITECTURE"

  publish-main:
    needs: [gate-main, build-main-architecture]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to assemble the multi-architecture candidate
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the multi-architecture candidate
        id: candidate
        shell: bash
        env:
          CANDIDATE_TAG: ${{ needs.gate-main.outputs.candidate-tag }}
        run: |
          set -euo pipefail
          candidate_ref="${REGISTRY}/${IMAGE_NAME}:${CANDIDATE_TAG}"
          docker buildx imagetools create \
            --tag "$candidate_ref" \
            "${candidate_ref}-amd64" \
            "${candidate_ref}-arm64"
          output="$(docker buildx imagetools inspect "$candidate_ref")"
          candidate_digest="$(printf '%s\n' "$output" | awk '$1 == "Digest:" { print $2; exit }')"
          if ! [[ "$candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Missing candidate digest::The assembled manifest has no canonical digest."
            exit 1
          fi
          echo "digest=$candidate_digest" >> "$GITHUB_OUTPUT"
          docker logout "$REGISTRY"

      - name: Verify anonymous candidate manifest
        shell: bash
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          bash tools/wait-for-container-digest.sh \
            "${REGISTRY}/${IMAGE_NAME}@${CANDIDATE_DIGEST}" \
            "$CANDIDATE_DIGEST"
          manifest_path="$RUNNER_TEMP/phd-atlas-main-candidate-manifest.json"
          docker buildx imagetools inspect \
            --raw "${REGISTRY}/${IMAGE_NAME}@${CANDIDATE_DIGEST}" > "$manifest_path"
          MANIFEST_PATH="$manifest_path" node <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH, 'utf8'))
          const platforms = new Set(
            (manifest.manifests || []).map((entry) =>
              `${entry.platform?.os || ''}/${entry.platform?.architecture || ''}`,
            ),
          )
          for (const expected of ['linux/amd64', 'linux/arm64']) {
            if (!platforms.has(expected)) {
              throw new Error(`Candidate image is missing ${expected}. Found: ${[...platforms].join(', ')}`)
            }
          }
          NODE

      - name: Log in to promote validated tags
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the candidate to main and immutable SHA
        shell: bash
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          SHORT_SHA: ${{ needs.gate-main.outputs.short-sha }}
        run: |
          set -euo pipefail
          sha_ref="${REGISTRY}/${IMAGE_NAME}:sha-${SHORT_SHA}"
          if output="$(docker buildx imagetools inspect "$sha_ref" 2>/dev/null)"; then
            existing_digest="$(printf '%s\n' "$output" | awk '$1 == "Digest:" { print $2; exit }')"
            if [[ "$existing_digest" != "$CANDIDATE_DIGEST" ]]; then
              echo "::error title=Immutable SHA tag mismatch::Refusing to overwrite $sha_ref."
              exit 1
            fi
          fi
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:main" \
            --tag "$sha_ref" \
            "${REGISTRY}/${IMAGE_NAME}@${CANDIDATE_DIGEST}"
          docker logout "$REGISTRY"

      - name: Verify anonymous promoted tags
        shell: bash
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          SHORT_SHA: ${{ needs.gate-main.outputs.short-sha }}
        run: |
          set -euo pipefail
          for ref in \
            "${REGISTRY}/${IMAGE_NAME}:main" \
            "${REGISTRY}/${IMAGE_NAME}:sha-${SHORT_SHA}"; do
            bash tools/wait-for-container-digest.sh "$ref" "$CANDIDATE_DIGEST"
          done

  smoke-promoted-main:
    needs: [gate-main, publish-main]
    name: smoke-main-${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify and smoke test promoted main
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          CANDIDATE_DIGEST: ${{ needs.publish-main.outputs.digest }}
        run: |
          set -euo pipefail
          bash tools/wait-for-container-digest.sh \
            "${REGISTRY}/${IMAGE_NAME}:main" \
            "$CANDIDATE_DIGEST"
          node tools/smoke-container-image.mjs \
            "${REGISTRY}/${IMAGE_NAME}:main" \
            "main-${ARCHITECTURE}" \
            --architectures "$ARCHITECTURE"
