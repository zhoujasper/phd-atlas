proxy_cache_path /var/cache/nginx/phd-atlas-static
    levels=1:2
    keys_zone=phd_atlas_static:16m
    inactive=30d
    max_size=512m
    use_temp_path=off;

# Upload buffering is isolated from the OS/default temp directory. Provision
# this filesystem with at least 6 GiB free space for the eight-request global
# ceiling below and make it writable by the Nginx worker before `nginx -t`.
client_body_temp_path /var/lib/nginx/phd-atlas-client-body 1 2;

# These zones are used only by the three audited upload locations. Realtime,
# streaming, and ordinary API traffic never inherits these limits.
# A campus/company NAT may use at most half of the eight-connection global
# envelope (four active uploads, 4 r/s with an eight-request burst). The global
# limit still reserves the other half for different networks and remains the
# absolute proxy-side disk/connection ceiling.
limit_conn_zone $server_name zone=phd_atlas_upload_global_conn:1m;
limit_conn_zone $binary_remote_addr zone=phd_atlas_upload_ip_conn:10m;
limit_req_zone $server_name zone=phd_atlas_upload_global_rate:1m rate=8r/s;
limit_req_zone $binary_remote_addr zone=phd_atlas_upload_ip_rate:10m rate=4r/s;

# Authentication traffic gets its own proxy-side envelope so login, register,
# password reset, passkey, impersonation, and admin password changes cannot be
# hidden behind the broad ordinary API location or starve uploads.
limit_conn_zone $binary_remote_addr zone=phd_atlas_auth_ip_conn:10m;
limit_req_zone $server_name zone=phd_atlas_auth_global_rate:1m rate=20r/s;
limit_req_zone $binary_remote_addr zone=phd_atlas_auth_ip_rate:10m rate=5r/s;

upstream phd_atlas_upstream {
    server 127.0.0.1:4317;
    keepalive 64;
}

map $http_upgrade $phd_atlas_connection_upgrade {
    default upgrade;
    # An empty hop-by-hop Connection header lets Nginx reuse its bounded
    # upstream keepalive pool for ordinary HTTP requests.
    '' '';
}

map $upstream_status $phd_atlas_static_no_cache {
    default 0;
    404 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name phd.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phd.example.com;

    ssl_certificate /etc/letsencrypt/live/phd.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phd.example.com/privkey.pem;
    root /opt/phd-atlas/dist;

    # Ordinary JSON/auth APIs are 1 MiB in Express. Keep a small proxy allowance
    # while refusing oversized bodies before Nginx buffers them to temporary
    # storage. Only the audited multipart locations below receive larger caps.
    client_max_body_size 2m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 120s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    proxy_connect_timeout 5s;
    limit_conn_status 429;
    limit_req_status 429;
    # Only Nginx-owned upload admission rejections reach this page; upstream
    # application responses remain untouched because proxy interception is off.
    error_page 429 = @phd_atlas_upload_busy;
    error_page 413 = @phd_atlas_request_too_large;
    # The Node worker also emits HSTS so that other topologies are covered.
    # Hide the upstream copy here and add exactly one proxy-owned header, which
    # is also the only source for assets served straight from disk.
    # Note: a location that declares its own proxy_hide_header replaces this
    # list rather than extending it, so such a location must repeat this line.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compress text/JSON at the proxy boundary so the Node worker does not need
    # per-request compression buffers and clients transfer fewer bytes.
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript application/x-ndjson image/svg+xml text/css text/javascript;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # A host installation serves immutable Vite assets directly, including the
    # build-generated .gz sidecar. Docker-only hosts transparently fall back to
    # a locked Nginx proxy cache, so an asset is fetched from Node only once.
    location ^~ /assets/ {
        gzip_static on;
        etag on;
        try_files $uri @phd_atlas_static_upstream;
        # Do not use `always`: a deploy-race 404 must never be cached by the
        # browser as an immutable one-year response.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    location @phd_atlas_static_upstream {
        proxy_pass http://phd_atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        # Declaring proxy_hide_header here replaces the server-level list, so
        # the HSTS entry must be repeated or the upstream copy would pass through.
        proxy_hide_header Cache-Control;
        proxy_hide_header Strict-Transport-Security;
        proxy_buffering on;
        proxy_cache phd_atlas_static;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 365d;
        # A missing hashed asset during a rolling deploy must be refetched after
        # the new build is present; never retain an upstream 404 in this cache.
        proxy_no_cache $phd_atlas_static_no_cache;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    # Realtime, incremental workspace, and AI streaming must bypass proxy
    # buffering. Keep these exact exceptions narrow so slow clients do not pin
    # ordinary Node responses.
    location = /api/events {
        proxy_pass http://phd_atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $phd_atlas_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        # Only a gateway failure before the SSE response begins can be remapped;
        # established streams retain their native protocol and close semantics.
        proxy_intercept_errors off;
        error_page 502 504 = @phd_atlas_api_unavailable;
    }

    location = /api/workspace/bootstrap/stream {
        proxy_pass http://phd_atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_intercept_errors off;
        error_page 502 504 = @phd_atlas_api_unavailable;
    }

    location = /api/ai/draft {
        proxy_pass http://phd_atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $phd_atlas_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_intercept_errors off;
        error_page 502 504 = @phd_atlas_api_unavailable;
    }

    location = /api/health/ws {
        proxy_pass http://phd_atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $phd_atlas_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_intercept_errors off;
        error_page 502 504 = @phd_atlas_api_unavailable;
    }

    # PHD_ATLAS_MULTIPART_UPLOADS
    # These are the complete upload.array('file', 20) route families. Each file
    # is capped at 25 MiB by the application; 502 MiB preserves the 500 MiB
    # batch ceiling plus bounded multipart metadata without granting the same
    # disk budget to JSON/auth.
    location ~* ^/api/(?:share/[^/]+/(?:materials/[^/]+/file|tasks/[^/]+/file)|asset-upload/[^/]+/file|applications/[^/]+/(?:materials(?:/[^/]+/file)?|tasks/[^/]+/file)|profile-assets/[^/]+/files)/?$ {
        client_max_body_size 502m;
        limit_conn phd_atlas_upload_global_conn 8;
        limit_conn phd_atlas_upload_ip_conn 4;
        limit_req zone=phd_atlas_upload_global_rate burst=16 nodelay;
        limit_req zone=phd_atlas_upload_ip_rate burst=8 nodelay;
        proxy_pass http://phd_atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_intercept_errors off;
        error_page 502 504 = @phd_atlas_api_unavailable;
    }

    # PHD_ATLAS_MAIL_MULTIPART
    # Outgoing communication accepts at most 10 files, with a server-enforced
    # aggregate attachment budget of 50 MiB. Keep only multipart overhead above
    # that limit so rejected mail cannot consume hundreds of MiB of proxy disk.
    location ~* ^/api/applications/[^/]+/communications/send/?$ {
        client_max_body_size 52m;
        limit_conn phd_atlas_upload_global_conn 8;
        limit_conn phd_atlas_upload_ip_conn 4;
        limit_req zone=phd_atlas_upload_global_rate burst=16 nodelay;
        limit_req zone=phd_atlas_upload_ip_rate burst=8 nodelay;
        proxy_pass http://phd_atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_intercept_errors off;
        error_page 502 504 = @phd_atlas_api_unavailable;
    }

    # System update uploads and installs are bounded but legitimately long.
    # They stay buffered; only realtime/streaming endpoints opt out above.
    # PHD_ATLAS_SYSTEM_UPDATE_UPLOAD
    # Express accepts one optional trailing slash. Keep this regex fully
    # anchored so no other admin/update path inherits the 102 MiB allowance.
    location ~* ^/api/admin/system-update/?$ {
        # The application accepts one 100 MiB package.
        client_max_body_size 102m;
        limit_conn phd_atlas_upload_global_conn 8;
        limit_conn phd_atlas_upload_ip_conn 4;
        limit_req zone=phd_atlas_upload_global_rate burst=16 nodelay;
        limit_req zone=phd_atlas_upload_ip_rate burst=8 nodelay;
        proxy_pass http://phd_atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_intercept_errors off;
        error_page 502 504 = @phd_atlas_api_unavailable;
    }

    # PHD_ATLAS_AUTH_RATE_LIMIT
    # Keep /api/auth/me and the public setup/share token reads on the ordinary
    # API location; this regex covers only credential-changing/auth flows.
    location ~* ^/api/auth/(?:login|register|password-reset|passkeys|impersonate|change-password)(?:/|$) {
        limit_conn phd_atlas_auth_ip_conn 8;
        limit_req zone=phd_atlas_auth_global_rate burst=30 nodelay;
        limit_req zone=phd_atlas_auth_ip_rate burst=12 nodelay;
        error_page 429 = @phd_atlas_auth_busy;
        proxy_pass http://phd_atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_intercept_errors off;
        error_page 502 504 = @phd_atlas_api_unavailable;
    }

    # PHD_ATLAS_SYSTEM_UPDATE_INSTALL
    location ~* ^/api/admin/system-update/install-release/?$ {
        proxy_pass http://phd_atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_intercept_errors off;
        error_page 502 504 = @phd_atlas_api_unavailable;
    }

    # Preserve a machine-readable retry contract when the Node worker is
    # momentarily absent. With proxy_intercept_errors off, an upstream
    # structured JSON 5xx remains untouched. The error_page below remaps only
    # an Nginx-owned 502/504 before upstream response headers have begun.
    location @phd_atlas_api_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "2" always;
        add_header X-Request-Id $request_id always;
        add_header X-PhD-Gateway-Error "unavailable" always;
        add_header Access-Control-Expose-Headers "X-PhD-Gateway-Error, X-Request-Id, Retry-After" always;
        return 503 '{"ok":false,"error":{"code":"SERVER_UNAVAILABLE","message":"PhD Atlas is temporarily unavailable."},"requestId":"$request_id"}';
    }

    # Preserve the application's structured overload contract for Nginx-owned
    # limit_req/limit_conn decisions on the audited upload endpoints.
    location @phd_atlas_upload_busy {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "2" always;
        add_header X-Request-Id $request_id always;
        return 429 '{"ok":false,"error":{"code":"SERVER_BUSY","message":"Upload capacity is temporarily busy."},"requestId":"$request_id"}';
    }

    # Auth rate-limit rejections are Nginx-owned and therefore carry the same
    # structured retry contract as the application's own overload responses.
    location @phd_atlas_auth_busy {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "2" always;
        add_header X-Request-Id $request_id always;
        return 429 '{"ok":false,"error":{"code":"SERVER_BUSY","message":"Authentication capacity is temporarily busy."},"requestId":"$request_id"}';
    }

    # The Nginx body-size gate rejects the body before proxying. Return an API
    # envelope instead of Nginx's HTML 413 so clients preserve the real cause.
    location @phd_atlas_request_too_large {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Request-Id $request_id always;
        return 413 '{"ok":false,"error":{"code":"REQUEST_TOO_LARGE","message":"The request body is too large."},"requestId":"$request_id"}';
    }

    # Do not use ^~ here: the audited multipart regex locations above must be
    # allowed to override the ordinary 2 MiB server-level body limit.
    location /api/ {
        proxy_pass http://phd_atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ordinary buffered responses are compressed once at Nginx, not in the
        # Node worker. Streaming locations above intentionally preserve client
        # encoding negotiation and therefore do not inherit this override.
        proxy_set_header Accept-Encoding "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $phd_atlas_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_intercept_errors off;
        error_page 502 504 = @phd_atlas_api_unavailable;
    }

    # Nginx absorbs slow downstream reads for ordinary API and frontend
    # responses. This releases the single Node worker sooner under concurrency.
    location / {
        proxy_pass http://phd_atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $phd_atlas_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
    }
}
